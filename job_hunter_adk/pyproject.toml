[project]
name = "job-hunter-adk"
version = "0.1.0"
description = "Multi-agent job and internship search system: parses a resume, searches multiple job portals plus the open web in parallel, ranks results against the candidate profile and stated filters, researches shortlisted companies, and drafts applications for human review."
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-cloud-aiplatform[adk,agent-engines]>=1.157.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "google-genai>=1.21.1,<2.0.0",
    "google-adk>=1.31.0,<2.0.0",
    "playwright>=1.48.0",
    "sentence-transformers>=3.3.0",
    "faiss-cpu>=1.9.0",
    "streamlit>=1.40.0",
    "sqlalchemy>=2.0.36",
    "scikit-learn>=1.9.0",
    "pandas>=2.3.0",
    "litellm>=1.52.0",
    "ddgs>=9.0.0",
    "rapidfuzz>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "google-adk[eval]>=1.18.0,<2.0.0",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "codespell>=2.2.0",
]

[tool.ruff.lint]
ignore = ["C901", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["job_hunter_adk"]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "sub_agents",
    "tools",
    "schemas",
    "services",
    "ui"
]
